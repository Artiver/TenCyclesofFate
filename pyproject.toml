[project]
name = "backend"
version = "1.0.0"
description = "浮生十梦，天道轮回"
readme = "README.md"
authors = [
    { name = "Artiver", email = "artiver@foxmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.162.7",
    "ijson>=3.6.0",
    "jsonpatch>=1.47",
    "libpass[bcrypt]>=1.9.4",
    "mysql-connector-python>=26.10.0",
    "openai>=3.51.0",
    "pydantic-settings>=2.16.3",
    "python-jose[cryptography]>=3.5.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
project = "backend:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
